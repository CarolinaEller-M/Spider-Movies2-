<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spider | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.2/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="login.css">
    <link rel="icon" href="files/img/favicon/favicon.ico" type="image/x-icon">
</head>
<body>
    <header>
        <a href="#" class="logo">
            <i class="bx bx-camera-movie"></i> Spider Movies
        </a>
        <div class="bx bx-menu" id="menu-icon"></div>

        <ul class="navbar">
            <li><a href="#home">Home</a></li>
        </ul>
    </header>

    <main class="container my-5">
        <div class="row justify-content-center align-items-stretch g-0">
            <div class="col-lg-6 col-md-6">
                <div class="video-container ratio ratio-16x9 h-100">
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" allowfullscreen></iframe>
                </div>
            </div>

            <div class="col-lg-6 col-md-6">
                <div class="card shadow h-100">
                    <div class="card-body p-4 d-flex flex-column">
                        <h2 class="text-center mb-4">Login</h2>
                        <form>
                            <div class="mb-3">
                                <label for="email" class="form-label">Email</label>
                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    placeholder="seu@email.com"
                                    required
                                />
                            </div>
                            <div class="mb-3">
                                <label for="senha" class="form-label">Senha</label>
                                <input
                                    type="password"
                                    class="form-control"
                                    id="senha"
                                    placeholder="Sua senha"
                                    required
                                />
                            </div>
                            <div class="mb-3 form-check">
                                <input
                                    type="checkbox"
                                    class="form-check-input"
                                    id="lembrar"
                                />
                                <label class="form-check-label" for="lembrar">Lembrar-me</label>
                            </div>
                            <button type="submit" class="btn btn-custom w-100 mb-3">
                                Entrar
                            </button>
                            
                            <div class="social-login">
                                <button type="button" class="google-btn" onclick="window.location.href='https://accounts.google.com/'">
                                    <i class="bx bxl-google"></i> Entrar com Google
                                </button>
                            </div>
                            
                            <div class="text-center mt-3">
                                <a href="#" class="text-decoration-none">Esqueceu a senha?</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <address>
            <p>
                Spider Movies<br>
                <a href="mailto:SpiderMovies@suport.com.br" class="gmail">SpiderMovies@suport.com.br</a>
            </p>
        </address>

        <p>
            Siga-nos em:
            <a href="https://www.facebook.com" target="_blank" class="social">
                <i class="bx bxl-facebook"></i> Facebook
            </a>
            <a href="https://www.twitter.com" target="_blank" class="social">
                <i class="bx bxl-twitter"></i> Twitter
            </a>
            <a href="https://www.instagram.com" target="_blank" class="social">
                <i class="bx bxl-instagram"></i> Instagram
            </a>
        </p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
